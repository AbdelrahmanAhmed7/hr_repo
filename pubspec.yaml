name: mediconsult_internal
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.4
  file_picker: ^10.3.8
  image_picker: ^1.2.1
  local_auth: ^2.3.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^13.0.1
  package_info_plus: ^8.1.1
  uuid: ^4.5.3
  url_launcher: ^6.3.1
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  graphview: ^1.5.1
  shimmer: ^3.0.0
  path_provider: ^2.1.5
  open_file: ^4.0.0
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  retrofit: ^4.9.2
  json_annotation: ^4.9.0
  flutter_secure_storage: ^10.0.0
  get_it: ^9.2.0
  go_router: ^14.0.0
  intl: ^0.20.2
  vector_math: ^2.2.0
  connectivity_plus: ^7.0.0
  sms_autofill: ^2.5.0
  fluttertoast: ^9.1.0
  sentry_flutter: ^9.16.0
  device_info_plus: ">=12.3.0 <12.4.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.5
  retrofit_generator: ^10.2.1
  json_serializable: ^6.11.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
